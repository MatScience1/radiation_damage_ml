[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiation-damage-ml"
version = "0.5.0"
description = "Pipeline for generating GNN training datasets for radiation damage prediction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "MatScience1"}
]
keywords = [
    "materials science",
    "machine learning",
    "radiation damage",
    "graph neural networks",
    "defect engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.21.0",
    "ase>=3.22.0",
    "torch>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "spglib>=2.0",
    "mypy==1.11.2",
    "ruff==0.6.9",
    "black==24.8.0",
    "isort==5.13.2",
    "pre-commit==3.8.0",
    "build==1.2.2",
]

[project.urls]
"Homepage" = "https://github.com/MatScience1/radiation_damage_ml"
"Bug Tracker" = "https://github.com/MatScience1/radiation_damage_ml/issues"
"Source" = "https://github.com/MatScience1/radiation_damage_ml"

[project.scripts]
benchmark = "benchmarks.benchmark_pipeline:main"

[tool.setuptools.packages.find]
include = ["pipeline*", "benchmarks*"]

# Mypy settings live in mypy.ini (single source of truth). Mypy reads
# mypy.ini before pyproject.toml, so a [tool.mypy] table here would be ignored.

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",   # line length is enforced by black
    "B008",   # allow function calls in argument defaults (dataclass fields)
    "UP006",  # keep typing.List/Dict for the Python 3.9 floor
    "UP007",  # keep typing.Optional for the Python 3.9 floor
    "UP035",  # keep typing imports for the Python 3.9 floor
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are expected in tests
