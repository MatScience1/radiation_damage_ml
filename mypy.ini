# Mypy targets the development interpreter (3.12) so that modern third-party
# stub files parse. Runtime compatibility with Python 3.9 to 3.11 is enforced
# by the CI test matrix, which executes the full suite on each version.
[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Tests use pytest fixtures that are injected without annotations on the
# individual test methods, so incomplete definitions are permitted here.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

# Third-party libraries. Import following is skipped so mypy does not parse
# their stubs (some use syntax newer than the 3.9 target). Their symbols are
# treated as Any, and our own annotations remain strictly checked.
[mypy-ase.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-numpy.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-torch.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-spglib.*]
follow_imports = skip
ignore_missing_imports = True
