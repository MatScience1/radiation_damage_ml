# Mypy targets the development interpreter (3.12) so that modern third-party
# stub files parse. Runtime compatibility with Python 3.9 to 3.11 is enforced
# by the CI test matrix, which executes the full suite on each version.
[mypy]
python_version = 3.12
# Incremental mode is disabled to avoid a mypy cache serialization bug
# (unresolved placeholder type) seen on some Python and mypy combinations.
incremental = False
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Tests use pytest fixtures that are injected without annotations on the
# individual test methods, so incomplete definitions are permitted here.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False
check_untyped_defs = True

# Third-party libraries: only missing imports are ignored. Import following is
# deliberately left enabled, because "follow_imports = skip" can leave
# unresolved placeholder types that trigger a mypy cache serialization error
# ("unresolved placeholder type None") on some Python and mypy combinations.
[mypy-ase.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-spglib.*]
ignore_missing_imports = True
